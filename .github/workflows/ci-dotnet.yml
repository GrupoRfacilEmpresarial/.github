# Reusable workflow: CI estandar para repos .NET (ENG-STD-001 seccion 13.5).
#
# Cubre los controles que bloquean el merge y que dependen del stack:
#   lint/formato        -> dotnet format --verify-no-changes
#   compilacion         -> dotnet build -c Release (warnings como errores opcional)
#   pruebas + cobertura -> dotnet test con coverlet, umbral de lineas
#   dependencias        -> dotnet list package --vulnerable (bloquea en High/Critical)
#
# No publica nada ni despliega: eso es container-release.yml + deploy-vps.yml.
#
# Uso minimo:
#
#   jobs:
#     dotnet:
#       uses: GrupoRfacilEmpresarial/.github/.github/workflows/ci-dotnet.yml@main
#       with:
#         solution: MiApi.slnx

name: ci-dotnet

on:
  workflow_call:
    inputs:
      solution:
        description: "Solucion o proyecto a compilar (.sln, .slnx o .csproj). Vacio = el que encuentre dotnet en la raiz"
        type: string
        default: ""
      dotnet-version:
        description: "Version del SDK. Se ignora si el repo tiene global.json"
        type: string
        default: "10.0.x"
      working-directory:
        description: "Directorio raiz del backend (monorepos back+front)"
        type: string
        default: "."
      test-filter:
        description: "Filtro de dotnet test. Por defecto excluye Category=Integration, que corre en el job de integracion"
        type: string
        default: "Category!=Integration"
      integration-tests:
        description: "Correr un segundo paso de pruebas con Category=Integration (requiere Docker en el runner si usa Testcontainers)"
        type: boolean
        default: false
      coverage-threshold:
        description: "Cobertura minima de lineas en porcentaje (0 = solo reporta)"
        type: number
        default: 0
      format-check:
        description: "Bloquear si dotnet format detecta cambios"
        type: boolean
        default: true
      warnings-as-errors:
        description: "Compilar con -warnaserror"
        type: boolean
        default: false
      vulnerability-check:
        description: "Bloquear si hay paquetes con vulnerabilidad High o Critical"
        type: boolean
        default: true
      runs-on:
        description: 'Runner en JSON. Ej: "ubuntu-latest" o ["self-hosted","linux","ci-heavy"]'
        type: string
        default: '"ubuntu-latest"'
      timeout-minutes:
        type: number
        default: 30

permissions:
  contents: read

jobs:
  dotnet:
    name: dotnet (format, build, test, audit)
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      SOLUTION: ${{ inputs.solution }}
    steps:
      - uses: actions/checkout@v4

      # global.json manda sobre el input: el SDK de CI y el local no pueden divergir.
      - name: Resolver origen de la version del SDK
        id: sdk
        run: |
          if [ -f global.json ]; then
            echo "file=${{ inputs.working-directory }}/global.json" >> "$GITHUB_OUTPUT"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.sdk.outputs.file == '' && inputs.dotnet-version || '' }}
          global-json-file: ${{ steps.sdk.outputs.file }}

      - name: Cache de NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore $SOLUTION

      - name: Formato
        if: inputs.format-check
        run: dotnet format $SOLUTION --verify-no-changes --no-restore

      - name: Build
        run: |
          extra=""
          if [ "${{ inputs.warnings-as-errors }}" = "true" ]; then extra="-warnaserror"; fi
          dotnet build $SOLUTION --configuration Release --no-restore $extra

      - name: Pruebas unitarias
        run: >-
          dotnet test $SOLUTION
          --configuration Release
          --no-build
          --filter "${{ inputs.test-filter }}"
          --collect "XPlat Code Coverage"
          --logger "trx;LogFilePrefix=unit"
          --results-directory "$RUNNER_TEMP/test-results"

      - name: Pruebas de integracion
        if: inputs.integration-tests
        run: >-
          dotnet test $SOLUTION
          --configuration Release
          --no-build
          --filter "Category=Integration"
          --logger "trx;LogFilePrefix=integration"
          --results-directory "$RUNNER_TEMP/test-results"

      - name: Reporte y umbral de cobertura
        env:
          MINIMO: ${{ inputs.coverage-threshold }}
        run: |
          shopt -s globstar nullglob
          reportes=("$RUNNER_TEMP"/test-results/**/coverage.cobertura.xml)
          if [ ${#reportes[@]} -eq 0 ]; then
            echo "::warning::No se genero ningun reporte de cobertura (falta coverlet.collector en los proyectos de prueba)."
            [ "$MINIMO" = "0" ] && exit 0
            echo "::error::Hay umbral de cobertura ($MINIMO%) pero no hay reporte."
            exit 1
          fi
          dotnet tool install --global dotnet-reportgenerator-globaltool >/dev/null
          export PATH="$PATH:$HOME/.dotnet/tools"
          IFS=';'; reportgenerator -reports:"${reportes[*]}" -targetdir:"$RUNNER_TEMP/coverage" \
            -reporttypes:"JsonSummary;MarkdownSummaryGithub" >/dev/null; unset IFS
          cat "$RUNNER_TEMP/coverage/SummaryGithub.md" >> "$GITHUB_STEP_SUMMARY"
          linea=$(jq -r '.summary.linecoverage // 0' "$RUNNER_TEMP/coverage/Summary.json")
          echo "Cobertura de lineas: ${linea}% (minimo ${MINIMO}%)"
          if awk -v l="$linea" -v m="$MINIMO" 'BEGIN { exit !(l + 0 < m + 0) }'; then
            echo "::error::Cobertura de lineas ${linea}% por debajo del minimo ${MINIMO}% (seccion 13.5)."
            exit 1
          fi

      # Lo hace la herramienta del SDK, sin servicios externos. Solo bloquea High/Critical:
      # Low/Moderate quedan como aviso para no frenar el flujo por ruido.
      - name: Paquetes vulnerables
        if: inputs.vulnerability-check
        run: |
          dotnet list $SOLUTION package --vulnerable --include-transitive --format json > "$RUNNER_TEMP/vuln.json" || true
          graves=$(jq '[.. | objects | select(has("vulnerabilities")) | .vulnerabilities[]? | select(.severity == "High" or .severity == "Critical")] | length' "$RUNNER_TEMP/vuln.json" 2>/dev/null || echo 0)
          todas=$(jq '[.. | objects | select(has("vulnerabilities")) | .vulnerabilities[]?] | length' "$RUNNER_TEMP/vuln.json" 2>/dev/null || echo 0)
          echo "Vulnerabilidades: $todas en total, $graves High/Critical."
          if [ "$graves" -gt 0 ]; then
            dotnet list $SOLUTION package --vulnerable --include-transitive
            echo "::error::Hay $graves paquetes con vulnerabilidad High/Critical (seccion 13.5)."
            exit 1
          fi

      - name: Subir resultados de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: |
            ${{ runner.temp }}/test-results/**/*.trx
            ${{ runner.temp }}/coverage/
          retention-days: 7
          if-no-files-found: ignore
