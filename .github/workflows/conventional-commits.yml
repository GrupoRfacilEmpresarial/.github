# Reusable workflow: validates Conventional Commits against ENG-STD-001 section 7.
#
# No external dependencies: plain git + grep. The organization is mostly .NET, so
# commitlint + husky would impose a Node toolchain on repos that have none.
#
# Usage from a consumer repo:
#
#   name: commits
#   on: [push, pull_request]
#   jobs:
#     conventional:
#       uses: GrupoRfacilEmpresarial/.github/.github/workflows/conventional-commits.yml@main

name: conventional-commits

on:
  workflow_call:
    inputs:
      max-subject-length:
        description: "Max subject length (ENG-STD-001 section 7.1 says 72)"
        type: number
        default: 72
        required: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Conventional Commits
        env:
          MAX_LEN: ${{ inputs.max-subject-length }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          # Merge commits are excluded (--no-merges): their subject is generated by git
          # and does not describe a change on its own.
          #
          # Range depends on the event. On a freshly created ref the push "before" is all
          # zeros and there is no range to resolve, so only the tip is validated.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            args="origin/${BASE_REF}..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            args="${BEFORE}..${SHA}"
          else
            args="-1"
          fi

          # Types are the closed list of ENG-STD-001 section 7.2, plus "merge" for the
          # organization's merge-commit convention.
          tipos='build|chore|ci|deprecate|docs|feat|fix|merge|perf|refactor|revert|security|style|test'
          patron="^(${tipos})(\([a-z0-9._/-]+\))?!?: .+"

          malos=0
          total=0
          while IFS= read -r asunto; do
            [ -z "$asunto" ] && continue
            total=$((total + 1))
            if ! printf '%s' "$asunto" | grep -Eq "$patron"; then
              echo "::error::Tipo no conforme (seccion 7.2): $asunto"
              malos=$((malos + 1))
              continue
            fi
            largo=$(printf '%s' "$asunto" | wc -m)
            if [ "$largo" -gt "$MAX_LEN" ]; then
              echo "::error::Asunto de $largo caracteres, maximo $MAX_LEN (seccion 7.1): $asunto"
              malos=$((malos + 1))
            fi
          done < <(git log --no-merges --format=%s $args)

          echo "Commits validados: $total. No conformes: $malos."
          [ "$malos" -eq 0 ] || {
            echo "::error::ENG-STD-001 seccion 0.2 regla 3: todo commit es convencional."
            exit 1
          }
