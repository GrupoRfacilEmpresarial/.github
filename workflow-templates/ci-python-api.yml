# CI/CD estandar para APIs Python en contenedor (ENG-STD-001 13.5, 12.6).
# Completar los valores marcados con <-- y borrar este bloque de ayuda.
name: ci

on:
  pull_request:
    branches: [develop, main]
    paths-ignore: ["**.md", "docs/**"]
  push:
    branches: [develop, "release/**", "hotfix/**"]
    tags: ["v*.*.*"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  calidad:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    uses: GrupoRfacilEmpresarial/.github/.github/workflows/ci-python.yml@main
    with:
      source-dirs: app                   # <--
      mypy-paths: app                    # <-- vacio para no correr mypy
      coverage-threshold: 80
      integration-tests: true            # <-- requiere marker "integration"
      migrate-command: alembic upgrade head
      test-env: |
        APP_ENV=dev

  release:
    needs: calidad
    if: ${{ !cancelled() && github.event_name == 'push' && contains(fromJSON('["success","skipped"]'), needs.calidad.result) }}
    uses: GrupoRfacilEmpresarial/.github/.github/workflows/container-release.yml@main
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      images: '[{"name":"","dockerfile":"docker/Dockerfile","target":"runtime"}]'   # <--

  deploy:
    needs: release
    if: needs.release.outputs.environment != ''
    uses: GrupoRfacilEmpresarial/.github/.github/workflows/deploy-vps.yml@main
    with:
      environment: ${{ needs.release.outputs.environment }}
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
